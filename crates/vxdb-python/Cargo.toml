[package]
name = "vxdb-python"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for vxdb"

[lib]
name = "_vxdb"
crate-type = ["cdylib"]

[dependencies]
vxdb-core = { path = "../vxdb-core" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
